<!DOCTYPE html>
<html>

<head>
  <title>Space Terra — AI Player Harness</title>
</head>

<style type="text/css">
  body {
    margin: 0px;
  }
</style>

<body>

  <div>
    <!--
      This is a copy of views/index.html for the AI-player harness only.
      The real page loads socket.io from cdn.socket.io, which this sandbox's
      network policy blocks. Since the AI player never submits a score, we
      swap it for a no-op stub instead of the real client - the game code
      calls io(url, {...}) once and never notices the difference.
    -->
    <script>
      window.io = function () {
        return { on: function () {}, emit: function () {}, connected: false };
      };
    </script>
    <script type="text/javascript" src="/javascripts/jquery.min.js"></script>
    <script type="text/javascript" src="/javascripts/phaser.min.js"></script>
    <script type="text/javascript" src="/javascripts/utils.js"></script>
    <script type="text/javascript" src="/javascripts/states/landing.js"></script>
    <script type="text/javascript" src="/javascripts/states/gameplay.js"></script>
    <script type="text/javascript" src="/javascripts/states/gameover.js"></script>
    <script type="text/javascript" src="/javascripts/states/leaderboard.js"></script>
    <script type="text/javascript" src="/javascripts/states/instructions.js"></script>
    <script type="text/javascript" src="/javascripts/config.js"></script>
    <script type="text/javascript" src="/javascripts/game.js"></script>
  </div>

  <label></label>
</body>

</html>
